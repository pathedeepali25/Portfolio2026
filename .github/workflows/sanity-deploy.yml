name: Deploy Sanity Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cms/deepalis-articles/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms/deepalis-articles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms/deepalis-articles/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Studio
        run: npx sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy Schema
        run: npx sanity schema deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
