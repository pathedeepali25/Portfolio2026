<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Article · Deepali Pathe</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('portfolio.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      else document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..600;1,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16181C; --bg-2: #1C1F24; --bg-3: #22262C;
    --fg: #E4E1DA; --fg-muted: #9E9C94; --fg-dim: #5A5A54;
    --line: #25282E; --accent: #9FB2C8; --accent-ink: #B6C5D8;
    --f-display: "Inter Tight", system-ui, sans-serif;
    --f-sans: "Inter", system-ui, sans-serif;
    --f-mono: "Inter", system-ui, sans-serif;
    --gutter: clamp(20px, 4vw, 48px);
  }
  html[data-theme="light"] {
    --bg: #F6F4F8; --bg-2: #EFEBF2; --bg-3: #E5E0EA;
    --fg: #1F1B2A; --fg-muted: #4A4458; --fg-dim: #8A8298;
    --line: #E2DCEA; --accent: #B07A8E; --accent-ink: #8E5C72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--fg);
    transition: background-color 1100ms cubic-bezier(0.22,1,0.36,1), color 900ms cubic-bezier(0.22,1,0.36,1) 100ms;
  }
  body { font-family: var(--f-sans); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }

  /* Nav */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    backdrop-filter: blur(24px) saturate(130%);
    background: rgba(22,24,28,0.7);
    border-bottom: 1px solid transparent;
    transition: border-color .5s, background .5s;
  }
  html[data-theme="light"] .nav { background: rgba(246,244,248,0.78) !important; }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(12px,1.5vw,18px) var(--gutter);
    max-width: 1400px; margin: 0 auto;
  }
  .logo { font-family: var(--f-display); font-weight: 400; font-size: 15px; letter-spacing: -0.005em; }
  .nav-back {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--f-sans); font-size: 13px; font-weight: 500;
    color: var(--fg-muted); padding: 8px 14px 8px 10px;
    border-radius: 999px; border: 1px solid var(--line); background: transparent;
    transition: color .25s, border-color .25s, background .25s; cursor: pointer;
  }
  .nav-back:hover { color: var(--fg); border-color: var(--fg-dim); background: var(--bg-2); }
  .nav-back .arr { transition: transform .3s cubic-bezier(.2,.7,.2,1); display: inline-block; }
  .nav-back:hover .arr { transform: translateX(-3px); }
  .theme-toggle {
    width: 44px; height: 28px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg-2); cursor: pointer; overflow: hidden; position: relative;
    transition: background-color 700ms cubic-bezier(0.22,1,0.36,1), border-color 700ms;
  }
  .theme-toggle .tt-knob {
    position: absolute; top: 50%; left: 4px; transform: translateY(-50%);
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(140deg, var(--fg) 0%, var(--accent-ink) 100%);
    transition: left 900ms cubic-bezier(0.22,1,0.36,1), background 900ms;
  }
  html[data-theme="light"] .theme-toggle .tt-knob {
    left: 20px;
    background: linear-gradient(140deg, #FFE4D2 0%, #FFB89C 45%, #C89AAD 100%);
    box-shadow: 0 0 16px 3px rgba(255,184,156,0.65);
  }

  /* Layout */
  .article-wrap { max-width: 720px; margin: 0 auto; padding: clamp(100px,12vw,140px) var(--gutter) clamp(80px,10vw,120px); }

  /* Skeleton */
  .skeleton-wrap { display: flex; flex-direction: column; gap: 18px; }
  .sk {
    background: linear-gradient(90deg, var(--bg-2) 0%, var(--bg-3) 50%, var(--bg-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* State */
  .state-block { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 40px; }
  .state-block .icon { font-size: 32px; opacity: .35; }
  .state-block .label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-dim); }
  .state-block .title { font-family: var(--f-display); font-size: clamp(22px,3vw,30px); font-weight: 320; letter-spacing: -0.018em; color: var(--fg); }
  .state-block .sub { font-size: 15px; color: var(--fg-muted); max-width: 38ch; }
  .state-block a { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); border-bottom: 1px solid var(--accent-ink); padding-bottom: 2px; }

  /* Article */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .article-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--f-sans); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-dim); margin-bottom: 28px;
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .05s forwards;
  }
  .article-eyebrow a { color: var(--fg-dim); transition: color .2s; }
  .article-eyebrow a:hover { color: var(--fg); }
  .article-eyebrow .cat { color: var(--accent-ink); }
  .article-title {
    font-family: var(--f-display); font-weight: 300;
    font-size: clamp(32px,5.5vw,64px); line-height: 1.06;
    letter-spacing: -0.025em; color: var(--fg); text-wrap: balance; margin-bottom: 28px;
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .1s forwards;
  }
  .article-title em { font-style: italic; color: var(--fg-muted); font-weight: 280; }
  .article-meta {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim);
    padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 48px;
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .18s forwards;
  }
  .article-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--fg-dim); flex-shrink: 0; }
  .article-meta .cat { color: var(--accent-ink); }
  .article-lede {
    font-family: var(--f-display); font-weight: 320;
    font-size: clamp(17px,1.9vw,22px); line-height: 1.55; letter-spacing: -0.01em;
    color: var(--fg-muted); margin-bottom: 48px; text-wrap: pretty;
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .24s forwards;
  }
  .article-lede em { color: var(--fg); }
  .article-body {
    font-size: 17px; line-height: 1.75; color: var(--fg-muted);
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .32s forwards;
  }
  .article-body p { margin-bottom: 1.4em; text-wrap: pretty; max-width: 66ch; }
  .article-body p:last-child { margin-bottom: 0; }
  .article-body strong { color: var(--fg); font-weight: 500; }
  .article-body em { color: var(--fg); font-style: italic; }
  .article-body a { color: var(--accent-ink); border-bottom: 1px solid color-mix(in oklab, var(--accent-ink) 50%, transparent); transition: border-color .2s; }
  .article-body a:hover { border-color: var(--accent-ink); }
  .article-body h2 { font-family: var(--f-display); font-weight: 320; font-size: clamp(22px,2.4vw,30px); letter-spacing: -0.018em; line-height: 1.18; color: var(--fg); margin: 2.4em 0 .8em; text-wrap: balance; }
  .article-body h3 { font-family: var(--f-display); font-weight: 340; font-size: clamp(18px,1.9vw,22px); letter-spacing: -0.014em; line-height: 1.25; color: var(--fg); margin: 1.8em 0 .6em; }
  .article-body h4 { font-family: var(--f-sans); font-weight: 600; font-size: 14px; color: var(--fg); margin: 1.4em 0 .4em; text-transform: uppercase; letter-spacing: 0.06em; }
  .article-body ul, .article-body ol { padding-left: 0; margin: 1.2em 0 1.4em; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; list-style: none; }
  .article-body ul li { position: relative; padding-left: 22px; }
  .article-body ul li::before { content: ''; position: absolute; left: 0; top: 14px; width: 12px; height: 1px; background: var(--fg-dim); }
  .article-body ol { counter-reset: li; }
  .article-body ol li { position: relative; padding-left: 28px; counter-increment: li; }
  .article-body ol li::before { content: counter(li); position: absolute; left: 0; top: 1px; font-family: var(--f-mono); font-size: 11px; color: var(--accent-ink); letter-spacing: 0.06em; }
  .article-body blockquote { font-family: var(--f-display); font-weight: 320; font-style: italic; font-size: clamp(19px,2.2vw,26px); line-height: 1.45; letter-spacing: -0.012em; color: var(--fg); border-left: 1px solid var(--accent); padding-left: clamp(18px,2.5vw,28px); margin: 2.4em 0; text-wrap: balance; max-width: 30ch; }
  .article-body figure { margin: 2.4em 0; }
  .article-body figure img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .article-body figure figcaption { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-dim); margin-top: 10px; }
  .article-body pre { background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; overflow-x: auto; margin: 1.8em 0; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; color: var(--fg-muted); }
  .article-body code { background: var(--bg-2); border: 1px solid var(--line); padding: 2px 7px; border-radius: 4px; font-family: var(--f-mono); font-size: 13px; color: var(--accent-ink); }
  .article-body pre code { background: none; border: none; padding: 0; color: inherit; }
  .article-body hr { border: none; border-top: 1px solid var(--line); margin: 3em 0; }
  .article-footer {
    margin-top: 72px; padding-top: 40px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .5s forwards;
  }
  .article-footer .back-link { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); transition: color .25s, gap .25s; }
  .article-footer .back-link:hover { color: var(--accent-ink); gap: 14px; }
  .article-footer .medium-link { font-family: var(--f-sans); font-size: 14px; font-weight: 500; padding: 12px 22px; border-radius: 999px; background: var(--fg); color: var(--bg); transition: background .25s; }
  .article-footer .medium-link:hover { background: var(--accent-ink); color: var(--bg); }

  /* Scroll progress */
  .scroll-progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; z-index: 60; pointer-events: none; }
  .scroll-progress::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background: linear-gradient(90deg, transparent, var(--accent-ink) 35%, var(--accent-ink) 65%, transparent); transform-origin: 0 50%; transform: scaleX(var(--scroll, 0)); transition: transform 80ms linear; opacity: 0.7; }

  /* Bloom */
  .bloom-wash { position: fixed; inset: 0; pointer-events: none; z-index: 300; opacity: 0; background: radial-gradient(circle at var(--bloom-x, 90%) var(--bloom-y, 5%), #1F2A38 0%, #2A2230 28%, transparent 62%); mix-blend-mode: screen; transition: opacity 380ms cubic-bezier(0.22,1,0.36,1); }
  .bloom-wash.washing { opacity: 1; }
  html[data-theme="light"] .bloom-wash { background: radial-gradient(circle at var(--bloom-x, 90%) var(--bloom-y, 5%), rgba(255,184,156,0.55) 0%, rgba(244,192,206,0.42) 22%, transparent 68%); mix-blend-mode: multiply; }
</style>
</head>
<body>

<div class="bloom-wash" id="bloomWash" aria-hidden="true"></div>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">deepali<span style="color:var(--fg-muted);font-style:italic;">.design</span></a>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" type="button">
        <span class="tt-knob" aria-hidden="true"></span>
      </button>
      <a href="index.html#writing" class="nav-back"><span class="arr">←</span><span>All writing</span></a>
    </div>
  </div>
</nav>

<main>
  <div class="article-wrap" id="articleWrap">
    <div class="skeleton-wrap" id="skeleton">
      <div class="sk" style="height:11px;width:28%;"></div>
      <div class="sk" style="height:54px;width:88%;margin-top:8px;"></div>
      <div class="sk" style="height:54px;width:66%;"></div>
      <div class="sk" style="height:16px;width:44%;margin-top:16px;"></div>
      <div class="sk" style="height:26px;width:96%;margin-top:28px;"></div>
      <div class="sk" style="height:26px;width:80%;"></div>
      <div class="sk" style="height:18px;width:92%;margin-top:28px;"></div>
      <div class="sk" style="height:18px;width:76%;"></div>
      <div class="sk" style="height:18px;width:84%;"></div>
      <div class="sk" style="height:18px;width:60%;"></div>
    </div>
  </div>
</main>

<script>
const SANITY = { projectId: '5p1ezhbv', dataset: 'production', apiVersion: '2023-05-03' };
const MEDIUM = 'https://medium.com/@deepdesign25';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? '' : dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function readMins(blocks) {
  if (!blocks) return null;
  const words = blocks.filter(b => b._type === 'block').flatMap(b => b.children || []).map(s => s.text || '').join(' ').trim().split(/\s+/).length;
  return Math.max(1, Math.round(words / 220)) + ' min read';
}

// Portable Text → HTML
function ptToHtml(blocks) {
  if (!blocks || !Array.isArray(blocks)) return '';
  const lines = blocks.map(block => {
    if (block._type === 'image') {
      const url = block.asset && block.asset.url ? block.asset.url : '';
      const cap = block.caption ? `<figcaption>${esc(block.caption)}</figcaption>` : '';
      return url ? `<figure><img src="${esc(url)}" alt="${esc(block.alt||'')}" loading="lazy">${cap}</figure>` : '';
    }
    if (block._type !== 'block') return '';
    const inner = spansToHtml(block.children || [], block.markDefs || []);
    if (block.style === 'blockquote') return `<blockquote>${inner}</blockquote>`;
    if (/^h[1-6]$/.test(block.style || '')) return `<${block.style}>${inner}</${block.style}>`;
    if (block.listItem) return `<li data-list="${block.listItem}">${inner}</li>`;
    return inner ? `<p>${inner}</p>` : '';
  });
  // Wrap consecutive list items
  let html = lines.join('\n');
  html = html.replace(/(<li data-list="bullet">.*?<\/li>\n?)+/gs, m => '<ul>' + m.replace(/ data-list="bullet"/g,'') + '</ul>');
  html = html.replace(/(<li data-list="number">.*?<\/li>\n?)+/gs, m => '<ol>' + m.replace(/ data-list="number"/g,'') + '</ol>');
  return html;
}
function spansToHtml(children, markDefs) {
  return children.map(span => {
    if (span._type !== 'span') return '';
    let t = esc(span.text || '');
    (span.marks || []).forEach(mark => {
      if (mark === 'strong') { t = `<strong>${t}</strong>`; return; }
      if (mark === 'em')     { t = `<em>${t}</em>`; return; }
      if (mark === 'code')   { t = `<code>${t}</code>`; return; }
      const def = (markDefs || []).find(d => d._key === mark);
      if (def && def._type === 'link') {
        const rel = def.href.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
        t = `<a href="${esc(def.href)}"${rel}>${t}</a>`;
      }
    });
    return t;
  }).join('');
}

function renderError(wrap, title, sub) {
  wrap.innerHTML = `<div class="state-block">
    <span class="icon">◌</span>
    <span class="label">Not found</span>
    <p class="title">${esc(title)}</p>
    <p class="sub">${esc(sub)}</p>
    <a href="index.html#writing">← Back to writing</a>
  </div>`;
}

async function load() {
  const slug = new URLSearchParams(window.location.search).get('slug');
  const wrap = document.getElementById('articleWrap');
  if (!slug) { renderError(wrap, 'No article specified', 'The URL is missing a slug.'); return; }

  const GROQ = `*[_type=="article" && slug.current=="${slug.replace(/"/g,'')}"][0]{title,"slug":slug.current,"excerpt":coalesce(excerpt,description,summary,""),"date":coalesce(publishedAt,_createdAt),"cover":mainImage.asset->url,"category":coalesce(categories[0]->title,category,""),"external":coalesce(externalUrl,link,""),content}`;

  try {
    const res = await fetch(`https://${SANITY.projectId}.api.sanity.io/v${SANITY.apiVersion}/data/query/${SANITY.dataset}?query=${encodeURIComponent(GROQ)}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { result: a } = await res.json();
    if (!a || !a.title) { renderError(wrap, 'Article not found', 'This article hasn't been published yet.'); return; }

    // No body content → redirect to external
    if (a.external && (!a.content || !a.content.length)) { window.location.replace(a.external); return; }

    document.title = a.title + ' · Deepali Pathe';
    const date = fmtDate(a.date);
    const mins = readMins(a.content);
    const cat  = a.category || '';

    const metaParts = [];
    if (cat)  metaParts.push(`<span class="cat">${esc(cat)}</span>`);
    if (date) metaParts.push(`<span>${esc(date)}</span>`);
    if (mins) metaParts.push(`<span>${esc(mins)}</span>`);
    const metaHtml = metaParts.join('<span class="dot"></span>');

    wrap.innerHTML = `
      <div class="article-eyebrow">
        <a href="index.html">deepali.design</a> <span style="color:var(--fg-dim)">·</span>
        <a href="index.html#writing">Writing</a>
        ${cat ? `<span style="color:var(--fg-dim)">·</span><span class="cat">${esc(cat)}</span>` : ''}
      </div>
      <h1 class="article-title">${esc(a.title)}</h1>
      ${metaHtml ? `<div class="article-meta">${metaHtml}</div>` : ''}
      ${a.excerpt ? `<p class="article-lede">${esc(a.excerpt)}</p>` : ''}
      <div class="article-body">${ptToHtml(a.content) || '<p>No content yet.</p>'}</div>
      <div class="article-footer">
        <a href="index.html#writing" class="back-link">← Back to writing</a>
        ${a.external ? `<a href="${esc(a.external)}" target="_blank" rel="noopener" class="medium-link">Read on Medium ↗</a>` : ''}
      </div>`;
  } catch (err) {
    console.error(err);
    renderError(wrap, 'Couldn't load article', 'Something went wrong. Please try again.');
  }
}
load();

// Nav scroll
document.getElementById('nav').addEventListener && window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
}, { passive: true });

// Scroll progress
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('scrollProgress').style.setProperty('--scroll', Math.min(1, h.scrollTop / (h.scrollHeight - h.clientHeight)) || 0);
}, { passive: true });

// Theme toggle
let switching = false;
const root = document.documentElement;
const bloom = document.getElementById('bloomWash');
function setTheme(next, ox, oy) {
  if (switching) return; switching = true;
  bloom.style.setProperty('--bloom-x', (ox ?? window.innerWidth - 80) + 'px');
  bloom.style.setProperty('--bloom-y', (oy ?? 60) + 'px');
  bloom.classList.add('washing');
  setTimeout(() => { root.setAttribute('data-theme', next); try { localStorage.setItem('portfolio.theme', next); } catch {} }, 120);
  setTimeout(() => bloom.classList.remove('washing'), 360);
  setTimeout(() => { switching = false; }, 520);
}
document.getElementById('themeToggle').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light', r.left + r.width/2, r.top + r.height/2);
});
</script>
</body>
</html>
